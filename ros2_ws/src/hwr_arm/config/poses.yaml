# forward is live-verified. The view variants retain its safe arm geometry and only move camera
# tilt; tucked remains a conservative alias. carry is the raised sock pose (plan/19).
poses:
  forward: {1: 500, 2: 701, 3: 120, 4: 300, 5: 500}
  floor: {1: 500, 2: 701, 3: 120, 4: 130, 5: 500}  # 88 cut cubes ~0.6 m out at the image top (2026-10-17)
  ceiling: {1: 500, 2: 701, 3: 120, 4: 500, 5: 500}
  # Holding a sock (plan/19, 2026-10-18): raised so it hangs clear of the floor (user: the low
  # forward arm dragged it), camera -10 deg. Tip 0.18 m ahead, 0.34 m up. Translation allows it.
  carry: {1: 500, 2: 500, 3: 500, 4: 85, 5: 500}
  tucked: {1: 500, 2: 701, 3: 120, 4: 300, 5: 500}
  # FK: camera ~61 deg below horizontal, image centre on the floor ~0.30 m ahead (plan/16, tune in 14.7).
  look_down: {1: 500, 2: 701, 3: 120, 4: 50, 5: 500}
  # /motion/back rear look (plan/18.4): user hand-taught compact fold (2026-10-18, pan 482 read),
  # turned to pan +-114 deg (25 pulses short of the servo ends); live: pan 25 sees +76..+149 deg (left).
  # User-checked: stays inside the chassis. The forward-arm version stuck out.
  rear_left: {1: 25, 2: 904, 3: 142, 4: 43, 5: 500}
  rear_right: {1: 975, 2: 904, 3: 142, 4: 43, 5: 500}
gripper:
  open: 200
  close: 500
  # Holding a 3 cm kit cube; readback short of `grip` by more than grasp_margin = something in the jaws.
  grip: 600  # live 2026-10-16: empty reads ~598, a held kit cube stalls at ~486
  # Cloth (plan/19): a sock pinched at `grip` slipped out on the lift (2026-10-18). Empty readback
  # 550->551, 600->596, 650->643, 700->664 (jaws shut ~660); user picked 680 = shut + a light press.
  squeeze: 680
grasp_margin: 40
# Wrist roll direction vs cube yaw: live 2026-10-16 green (34 deg roll) met the cube rotated wrong with +1.
roll_sign: -1
# Held-cube centre height above the contact point at release; +0.005 dropped green off a 2-stack (live).
place_clearance: -0.005
# Place-only sideways trim (m, + = left of the arm's direction): 6 verified places 2026-10-17 all
# landed right, mean -0.0073 +/- 0.0035. Picks hide it (the jaws re-centre the cube sideways).
place_side_trim: 0.0073
# Places ON a cube landed -8.3/-8.6/-9.1 mm sideways with the floor trim (S6 2026-10-17) -> 7.3 + 8.7.
# Untested live: verify with tools/side_cal_cycle.zsh (blue on red, level 1).
place_side_trim_on: 0.016
# Places overshoot radially in proportion to tilt from vertical: floor calibration 2026-10-17
# (14 places) +0.3..0.95 cm at -85, +1.3 at -70, +2.75 at -55 -> 0.76 mm/deg, pulled back.
place_radial_per_deg: 0.00076
# Kit cube edge (m) and OpenCV LAB ranges AFTER floor normalisation (image median a/b -> 128),
# tuned live 2026-10-16 under two lamps (evidence/phase14/find3-5.jpg); glare is b >= 83, shadows a 129-144.
cube_size: 0.03
cubes:
  red: {min: [30, 150, 95], max: [230, 255, 200]}  # evening 2026-10-17: red a 154-157, finger < 145
  # 2026-10-17 sunlight: green b 113-118, blue b 75-83 / a 125-128 (sun_find1.jpg) -> widened.
  green: {min: [20, 0, 80], max: [150, 118, 124]}  # L <= 150: sunlit floor reads green-blue
  blue: {min: [50, 112, 0], max: [140, 255, 86]}  # L <= 140: bright bluish floor glare; evening glare b 88-98 made a phantom blue
