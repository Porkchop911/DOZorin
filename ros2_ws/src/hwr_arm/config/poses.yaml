# forward is live-verified. The view variants retain its safe arm geometry and
# only move camera tilt; carry/tucked remain conservative aliases until their
# physical clearance gates are accepted.
poses:
  forward: {1: 500, 2: 701, 3: 120, 4: 300, 5: 500}
  floor: {1: 500, 2: 701, 3: 120, 4: 88, 5: 500}
  ceiling: {1: 500, 2: 701, 3: 120, 4: 500, 5: 500}
  carry: {1: 500, 2: 701, 3: 120, 4: 300, 5: 500}
  tucked: {1: 500, 2: 701, 3: 120, 4: 300, 5: 500}
  # FK: camera ~61 deg below horizontal, image centre on the floor ~0.30 m ahead (plan/16, tune in 14.7).
  look_down: {1: 500, 2: 701, 3: 120, 4: 50, 5: 500}
gripper:
  open: 200
  close: 500
  # Holding a 3 cm kit cube; readback short of `close` by more than grasp_margin = something in the jaws.
  grip: 500
grasp_margin: 30
# Kit cube edge (m) and OpenCV LAB ranges AFTER floor normalisation (image median a/b -> 128),
# tuned live 2026-10-16 under two lamps (evidence/phase14/find3-5.jpg); glare is b >= 83, shadows a 129-144.
cube_size: 0.03
cubes:
  red: {min: [30, 160, 95], max: [255, 255, 200]}
  green: {min: [20, 0, 80], max: [255, 120, 110]}
  blue: {min: [30, 125, 0], max: [255, 255, 75]}
