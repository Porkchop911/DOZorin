[metadata]
name = hwr-core
version = 0.0.1
description = Framework-free core library for the highwonder rework: RRC protocol, kinematics, safety. No ROS imports.
license = MIT

[options]
packages = find:
python_requires = >=3.10
install_requires =
    numpy
    pyserial
    PyYAML

[options.packages.find]
include = hwr_core*

[options.extras_require]
dev = pytest
